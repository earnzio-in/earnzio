name: Build Earnzio Firebase Ultimate APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/assets
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.unity3d.ads:unity-ads:4.12.0'
          }
          EOF

          # DOWNLOAD SPLASH VIDEO & LOGO
          wget -O app/src/main/res/drawable/app_icon.jpg "https://res.cloudinary.com/ixxjuj5g/image/upload/v1790382703/20260926_003238.jpg"
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # ==========================================
          # 100% OFFLINE HTML + CSS + FIREBASE JS 
          # ==========================================
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
            <title>Earnzio Firebase</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
              
              /* 🔵 LIGHT BLUE & WHITE GRADIENT THEME 🔵 */
              body { 
                margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
                background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
                background-attachment: fixed; color: #000; user-select: none; -webkit-user-select: none;
              }
              
              /* LOGIN & REGISTER SCREEN */
              #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }
              .auth-box { background: rgba(255,255,255,0.9); width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 2px solid #bae6fd; }
              .auth-title { font-size: 28px; font-weight: 900; color: #0369a1; margin-bottom: 20px; }
              .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #bae6fd; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
              .auth-input:focus { border-color: #0284c7; }
              .auth-btn { background: #0284c7; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
              .auth-switch { color: #0369a1; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: underline; margin-top:10px; }
              #authLoading { display: none; color: #0369a1; font-weight: bold; margin-bottom: 10px; }

              /* MAIN APP CONTAINER */
              #main-app { display: none; padding-bottom: 70px; }
              
              .top-bar { display: flex; justify-content: flex-end; padding: 15px; }
              .coin-box { background: white; padding: 8px 15px; border-radius: 8px; border: 2px solid #bae6fd; font-weight: 900; font-size: 20px; color: #059669; display: flex; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
              
              .tab-content { display: none; padding: 10px; animation: fadeIn 0.3s ease; }
              .tab-content.active { display: block; }
              @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

              /* HOME TAB */
              .daily-claim-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid #bae6fd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
              .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
              .day-box { background: #f0f9ff; border: 2px solid #7dd3fc; border-radius: 8px; width: 12%; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color:#0369a1; }
              .day-box.claimed { background: #059669; color: white; border-color: #059669; }
              .claim-btn { background: #ef4444; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
              
              .task-card { background: white; border: 2px solid #bae6fd; border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
              .task-title { font-size: 22px; font-weight: 900; margin: 15px 0 10px 0; color: #0369a1; }
              .start-btn { background: #f0f9ff; border: 2px solid #38bdf8; padding: 10px 30px; border-radius: 8px; font-size: 20px; font-weight: 900; color: #0284c7; cursor: pointer; }

              /* CAPTCHA & QUIZ */
              .submit-btn { background: #059669; color: white; width: 100%; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-bottom:10px; }
              .captcha-box { background: #f0f9ff; padding: 30px 20px; text-align: center; font-size: 28px; font-family: 'Courier New', monospace; font-weight: 900; letter-spacing: 8px; border: 2px dashed #0284c7; margin: 20px 0; border-radius: 8px; color:#0369a1;}
              .captcha-input { width: 100%; padding: 15px; border: 2px solid #bae6fd; border-radius: 8px; font-size: 18px; text-align: center; margin-bottom: 20px; box-sizing: border-box; font-weight: bold; outline:none; }
              
              .quiz-q { background: white; padding: 20px; border-radius: 8px; font-size: 18px; font-weight: 900; margin: 20px 0; border: 2px solid #bae6fd; color:#0369a1; }
              .quiz-opt { background: #f0f9ff; padding: 15px; border: 2px solid #bae6fd; border-radius: 8px; margin-bottom: 10px; font-weight: bold; display: flex; gap: 15px; cursor: pointer; font-size: 16px; align-items: center; color:#0c4a6e; }
              .opt-let { font-weight: 900; background: white; border: 2px solid #7dd3fc; padding: 5px 12px; border-radius: 5px; }
              .quiz-opt.correct { background: #059669; color: white; border-color: #059669; }
              .quiz-opt.wrong { background: #ef4444; color: white; border-color: #ef4444; }
              .quiz-exp { background: #059669; color: white; padding: 15px; border-radius: 8px; font-weight: bold; display: none; margin-top: 15px; font-size: 16px; text-align:center; }

              /* YOUTUBE WATCH TAB */
              #tab-watch { padding: 0 !important; height: calc(100vh - 65px); background: #000; }
              .yt-frame { width: 100%; height: 100%; border: none; }

              /* PROFILE TAB */
              .pro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
              .pro-name { background: white; padding: 10px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: bold; font-size: 16px; flex-grow: 1; text-align: center; margin: 0 10px; color:#0369a1;}
              .id-box { background: #0284c7; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; text-align: center; }
              .pro-wallet { background: #0369a1; color: white; text-align: center; padding: 20px; border-radius: 10px; font-size: 45px; font-weight: 900; margin-bottom: 15px; border:3px solid #7dd3fc; }
              
              .menu-item { background: white; padding: 15px 20px; border: 2px solid #bae6fd; border-radius: 8px; margin-bottom: 10px; font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; cursor: pointer; color:#0369a1; }
              
              /* INLINE EXPANDABLE SECTIONS */
              .inline-section { display: none; background: rgba(255,255,255,0.9); padding: 15px; border: 2px dashed #38bdf8; border-radius: 8px; margin-bottom: 10px; animation: fadeIn 0.3s ease; }
              .w-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
              .w-tab { flex: 1; background: white; text-align: center; padding: 10px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 14px; color:#0369a1;}
              .w-tab.active { background: #e0f2fe; border-color:#0284c7; }
              .w-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: bold; box-sizing: border-box; outline:none; }
              
              .tx-box { padding: 10px; border-radius: 8px; border: 2px solid #bae6fd; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; background:white; color:#0c4a6e;}
              .tx-suc { border-left: 5px solid #059669; }
              .tx-pen { border-left: 5px solid #f59e0b; }

              /* BOTTOM NAV */
              .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 2px solid #bae6fd; z-index: 1000; }
              .nav-icon { width: 50px; height: 50px; background: #f0f9ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; border: 2px solid #bae6fd; transition: 0.3s; }
              .nav-icon.active { background: #0284c7; color: white; border-color: #0369a1; transform: scale(1.1); }
            </style>
            
            <!-- 🔥 FIREBASE SDK SETUP 🔥 -->
            <script type="module">
              import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
              import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
              import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

              // 🔴 MEE FIREBASE CONFIG DETAILS 🔴
              const firebaseConfig = {
                apiKey: "AIzaSyAZLSUcRB160A4L7_Cf9erbnIBKEiRwAo4",
                authDomain: "earnzio-in.firebaseapp.com",
                databaseURL: "https://earnzio-in-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "earnzio-in",
                storageBucket: "earnzio-in.firebasestorage.app",
                messagingSenderId: "935935737332",
                appId: "1:935935737332:web:70bc35401fb05995274da1",
                measurementId: "G-BGW0EW7312"
              };

              const app = initializeApp(firebaseConfig);
              const auth = getAuth(app);
              const db = getDatabase(app);

              let currentUser = null;
              let currentCoins = 0;

              // Check Login Status Realtime
              onAuthStateChanged(auth, (user) => {
                if (user) {
                  currentUser = user;
                  document.getElementById('auth-screen').style.display = 'none';
                  document.getElementById('main-app').style.display = 'block';
                  document.getElementById('proEmail').innerText = user.email;
                  document.getElementById('proUid').innerText = "ID: " + user.uid.substring(0,6).toUpperCase();
                  fetchUserData(user.uid);
                } else {
                  currentUser = null;
                  document.getElementById('auth-screen').style.display = 'flex';
                  document.getElementById('main-app').style.display = 'none';
                }
              });

              // AUTHENTICATION FUNCTION (LOGIN/REGISTER)
              window.doAuth = function(type) {
                const email = document.getElementById('authEmail').value;
                const pass = document.getElementById('authPass').value;
                if(!email || !pass) { alert("Please enter Email & Password"); return; }
                
                document.getElementById('authLoading').style.display = 'block';

                if(type === 'login') {
                  signInWithEmailAndPassword(auth, email, pass).catch((e) => {
                    document.getElementById('authLoading').style.display = 'none';
                    alert(e.message);
                  });
                } else {
                  createUserWithEmailAndPassword(auth, email, pass)
                    .then((cred) => {
                      // Save Initial Coins (12.5) to Database for new user
                      set(ref(db, 'users/' + cred.user.uid), {
                        email: email,
                        coins: 12.5,
                        lastClaimDate: ""
                      });
                      document.getElementById('authLoading').style.display = 'none';
                      alert("Registration Success! 12.5 Coins Bonus Added.");
                    }).catch((e) => {
                      document.getElementById('authLoading').style.display = 'none';
                      alert(e.message);
                    });
                }
              };

              // LOGOUT
              window.logout = function() { signOut(auth); };

              // FETCH USER COINS FROM DB
              function fetchUserData(uid) {
                get(ref(db, 'users/' + uid)).then((snapshot) => {
                  if (snapshot.exists()) {
                    const data = snapshot.val();
                    currentCoins = data.coins || 0;
                    updateUI();
                  }
                });
              }

              // ADD COINS TO DB
              window.addCoins = function(amount) {
                if(!currentUser) return;
                currentCoins += amount;
                update(ref(db, 'users/' + currentUser.uid), { coins: currentCoins });
                updateUI();
              };

              // UPDATE HTML UI
              function updateUI() {
                document.querySelectorAll('.bal-txt').forEach(el => el.innerText = currentCoins.toFixed(1));
              }

              // DAILY CLAIM WITH FIREBASE CHECK
              window.claimDaily = function() {
                if(!currentUser) return;
                const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
                get(ref(db, 'users/' + currentUser.uid + '/lastClaimDate')).then((snap) => {
                  if(snap.exists() && snap.val() === today) {
                    alert("You have already claimed today's bonus!");
                  } else {
                    currentCoins += 5.0;
                    update(ref(db, 'users/' + currentUser.uid), { 
                      coins: currentCoins,
                      lastClaimDate: today
                    });
                    updateUI();
                    alert("Daily Bonus Claimed! +5 Coins");
                  }
                });
              };
            </script>
          </head>
          <body>

            <!-- AUTH SCREEN -->
            <div id="auth-screen">
              <div class="auth-box">
                <div class="auth-title" id="authTitle">LOGIN</div>
                <div id="authLoading">Processing...</div>
                <input type="email" id="authEmail" class="auth-input" placeholder="Email Address">
                <input type="password" id="authPass" class="auth-input" placeholder="Password (Min 6 chars)">
                <button class="auth-btn" id="authBtn" onclick="doAuth('login')">LOGIN TO ACCOUNT</button>
                <div class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">Don't have an account? Register Here</div>
              </div>
            </div>

            <!-- MAIN APP (Hidden until login) -->
            <div id="main-app">
              <div class="top-bar">
                <div class="coin-box">🪙 <span class="bal-txt">0.0</span></div>
              </div>

              <!-- HOME TAB -->
              <div id="tab-home" class="tab-content active">
                <div class="daily-claim-box">
                  <div class="days-row">
                    <div class="day-box">1</div><div class="day-box">2</div><div class="day-box">3</div>
                    <div class="day-box">4</div><div class="day-box">5</div><div class="day-box">6</div><div class="day-box">7</div>
                  </div>
                  <button class="claim-btn" onclick="claimDaily()">CLAIM DAILY BONUS</button>
                </div>
                <div class="task-card">
                  <div class="task-title">Solve Captcha</div>
                  <div class="start-btn" onclick="openCaptcha()">▶ START</div>
                </div>
                <div class="task-card">
                  <div class="task-title">Play Quiz</div>
                  <div class="start-btn" onclick="openQuiz()">▶ START</div>
                </div>
              </div>

              <!-- CAPTCHA TAB -->
              <div id="tab-captcha" class="tab-content">
                <h2 style="text-align:center; color:#0369a1;">Solve Captcha</h2>
                <div class="captcha-box" id="capText">A7X9P</div>
                <input type="text" class="captcha-input" id="capInput" placeholder="ENTER TEXT HERE">
                <button class="submit-btn" onclick="submitCaptcha()">SUBMIT CAPTCHA</button>
                <button class="submit-btn" style="background:#0284c7;" onclick="nav('home')">BACK TO HOME</button>
              </div>

              <!-- QUIZ TAB -->
              <div id="tab-quiz" class="tab-content">
                <h2 style="text-align:center; color:#0369a1;">GK Quiz</h2>
                <div class="quiz-q" id="qText">QUESTION TEXT HERE</div>
                <div id="opts"></div>
                <div class="quiz-exp" id="qExp"></div>
                <button class="submit-btn" style="background:#0284c7; margin-top:20px;" onclick="nav('home')">EXIT QUIZ</button>
              </div>

              <!-- 🔴 WATCH TAB (YOUTUBE EMBED) 🔴 -->
              <div id="tab-watch" class="tab-content">
                <!-- Loads Official YouTube Mobile Site inside App -->
                <iframe src="https://m.youtube.com/" class="yt-frame" allowfullscreen></iframe>
              </div>

              <!-- PROFILE TAB & INLINE WITHDRAWAL -->
              <div id="tab-profile" class="tab-content">
                <div class="pro-header">
                  <div class="pro-name" id="proEmail">user@email.com</div>
                </div>
                <div class="id-box" id="proUid">ID : XXXXXX</div>
                <div class="pro-wallet">🪙 <span class="bal-txt">0.0</span></div>
                
                <div class="menu-item" onclick="toggleSection('withdrawSec')">
                  💳 WITHDRAWAL <span>▼</span>
                </div>
                
                <div id="withdrawSec" class="inline-section">
                  <div class="w-tabs">
                    <div class="w-tab active" id="tabBank" onclick="selW('bank')">BANK 🏦</div>
                    <div class="w-tab" id="tabUpi" onclick="selW('upi')">UPI ID</div>
                  </div>
                  <div id="w-form-bank">
                    <input type="text" class="w-input" placeholder="BANK NAME">
                    <input type="text" class="w-input" placeholder="ACCOUNT HOLDER">
                    <input type="number" class="w-input" placeholder="ACCOUNT NUMBER">
                  </div>
                  <div id="w-form-upi" style="display:none;">
                    <input type="text" class="w-input" placeholder="ENTER UPI ID">
                  </div>
                  <input type="number" class="w-input" placeholder="Amount" style="border-color:#0284c7;">
                  <button class="submit-btn" onclick="alert('Withdrawal Request Submitted!')">SUBMIT REQUEST</button>
                </div>

                <div class="menu-item" onclick="toggleSection('txSec')">
                  📜 RECENT TRANSACTIONS <span>▼</span>
                </div>
                
                <div id="txSec" class="inline-section">
                  <div class="tx-box tx-pen"><span>Pending Request</span> <span>🪙 12.5</span></div>
                  <div class="tx-box tx-suc"><span>Success</span> <span>🪙 60</span></div>
                  <div class="tx-box tx-suc"><span>Success</span> <span>🪙 147</span></div>
                </div>

                <div class="menu-item" onclick="logout()" style="color:#ef4444; border-color:#ef4444;">🚪 LOGOUT <span>➜</span></div>
              </div>

              <!-- BOTTOM NAV -->
              <div class="bottom-nav">
                <div class="nav-icon active" id="nav-home" onclick="nav('home')">🏠</div>
                <div class="nav-icon" id="nav-watch" onclick="nav('watch')">▶</div>
                <div class="nav-icon" id="nav-profile" onclick="nav('profile')">👤</div>
              </div>
            </div>

            <script>
              // --- LOGIN TOGGLE UI ---
              let isLogin = true;
              function toggleAuthMode() {
                isLogin = !isLogin;
                document.getElementById('authTitle').innerText = isLogin ? "LOGIN" : "REGISTER";
                document.getElementById('authBtn').innerText = isLogin ? "LOGIN TO ACCOUNT" : "CREATE ACCOUNT";
                document.getElementById('authBtn').setAttribute('onclick', isLogin ? "doAuth('login')" : "doAuth('register')");
                document.getElementById('authSwitch').innerText = isLogin ? "Don't have an account? Register Here" : "Already have an account? Login";
              }

              // --- NAVIGATION ---
              function nav(tab) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
                
                document.getElementById('tab-' + tab).classList.add('active');
                if(tab === 'home' || tab === 'watch' || tab === 'profile') {
                  document.getElementById('nav-' + tab).classList.add('active');
                }
              }

              // --- INLINE TOGGLES (PROFILE) ---
              function toggleSection(id) {
                const sec = document.getElementById(id);
                if(sec.style.display === 'block') {
                  sec.style.display = 'none';
                } else {
                  document.getElementById('withdrawSec').style.display = 'none';
                  document.getElementById('txSec').style.display = 'none';
                  sec.style.display = 'block';
                }
              }

              function selW(type) {
                document.getElementById('tabBank').classList.remove('active');
                document.getElementById('tabUpi').classList.remove('active');
                document.getElementById('w-form-bank').style.display = 'none';
                document.getElementById('w-form-upi').style.display = 'none';
                if(type === 'bank') {
                  document.getElementById('tabBank').classList.add('active');
                  document.getElementById('w-form-bank').style.display = 'block';
                } else {
                  document.getElementById('tabUpi').classList.add('active');
                  document.getElementById('w-form-upi').style.display = 'block';
                }
              }

              // --- CAPTCHA ---
              let curCap = "";
              function genCap() {
                const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; curCap = "";
                for(let i=0; i<6; i++) curCap += c.charAt(Math.floor(Math.random()*c.length));
                document.getElementById('capText').innerText = curCap;
                document.getElementById('capInput').value = "";
              }
              function openCaptcha() { nav('captcha'); genCap(); }
              function submitCaptcha() {
                if(document.getElementById('capInput').value.trim().toUpperCase() === curCap) {
                  addCoins(1.5); // 🔴 FIREBASE UPDATE FUNCTION
                  alert("Correct! +1.5 Coins Added"); 
                  nav('home');
                } else { alert("Wrong Captcha! Try again."); genCap(); }
              }

              // --- QUIZ ---
              const qData = { q: "What is the capital of India?", o: ["Mumbai", "New Delhi", "Chennai", "Kolkata"], a: 1, e: "New Delhi is the capital of India." };
              function openQuiz() {
                nav('quiz');
                document.getElementById('qText').innerText = qData.q;
                document.getElementById('qExp').style.display = 'none';
                let oHtml = "";
                const lets = ["A", "B", "C", "D"];
                qData.o.forEach((opt, i) => {
                  oHtml += `<div class="quiz-opt" id="qo_${i}" onclick="checkQ(${i})"><span class="opt-let">${lets[i]}</span> ${opt}</div>`;
                });
                document.getElementById('opts').innerHTML = oHtml;
              }
              function checkQ(idx) {
                document.getElementById('qo_'+qData.a).classList.add('correct');
                if(idx === qData.a) {
                  addCoins(2.0); // 🔴 FIREBASE UPDATE FUNCTION
                  document.getElementById('qExp').innerHTML = `✓ CORRECT!<br>${qData.e}`;
                  document.getElementById('qExp').style.display = 'block';
                  setTimeout(()=> { nav('home'); }, 2000);
                } else {
                  document.getElementById('qo_'+idx).classList.add('wrong');
                  document.getElementById('qExp').innerHTML = `<span style="color:#ffb3b3;">✗ WRONG ANSWER</span><br>${qData.e}`;
                  document.getElementById('qExp').style.display = 'block';
                  setTimeout(()=> { nav('home'); }, 3000);
                }
              }
            </script>
          </body>
          </html>
          EOF

