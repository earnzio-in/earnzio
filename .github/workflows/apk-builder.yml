name: Build Earnzio Ultimate Pro APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/raw
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # DOWNLOAD SPLASH VIDEO
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # LAYOUT
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#ffffff">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <VideoView
                  android:id="@+id/splashVideo"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center" />
          </FrameLayout>
          EOF

          # THEME
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#e0f2fe</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          
          # MANIFEST
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application android:label="Earnzio" android:theme="@style/Theme.App" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MAIN ACTIVITY - AUTO UPDATE ENABLED!
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.VideoView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private VideoView splashVideo;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  splashVideo = findViewById(R.id.splashVideo);
                  
                  Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.splash_video);
                  splashVideo.setVideoURI(videoUri);
                  splashVideo.setOnPreparedListener(mp -> {
                      mp.setLooping(false);
                      mp.setVideoScalingMode(MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING);
                      splashVideo.start();
                  });
                  splashVideo.setOnCompletionListener(mp -> {
                      splashVideo.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  });
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true); 
                  webSettings.setMediaPlaybackRequiresUserGesture(false); 
                  
                  webView.setWebViewClient(new WebViewClient());
                  
                  // 🔴 IDHI MEE LIVE GITHUB PAGES LINK - INDHUVALLA APP AUTO UPDATE AVUTHUNDI 🔴
                  webView.loadUrl("https://earnzio-in.github.io/earnzio/");
              }
          }
          EOF

      - name: Build Pro Developer APK
        run: gradle :app:assembleDebug

      - name: Upload Super Final APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNZIO-AUTO-UPDATE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
