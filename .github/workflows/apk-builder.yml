          # MAIN ACTIVITY 
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.VideoView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private VideoView splashVideo;
              private ImageView splashLogo;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  splashVideo = findViewById(R.id.splashVideo);
                  splashLogo = findViewById(R.id.splashLogo);
                  
                  // 🔥 SPLASH SCREEN 🔥
                  Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.splash_video);
                  splashVideo.setVideoURI(videoUri);
                  splashVideo.setOnPreparedListener(mp -> {
                      mp.setLooping(false);
                      mp.setOnInfoListener((mp1, what, extra) -> {
                          if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                              splashLogo.setVisibility(View.GONE);
                              return true;
                          }
                          return false;
                      });
                      splashVideo.start();
                  });
                  splashVideo.setOnCompletionListener(mp -> {
                      splashVideo.setVisibility(View.GONE);
                      splashLogo.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  });
                  
                  // 🔥 WEBVIEW SETUP (Important for Firebase & YouTube) 🔥
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true); // REQUIRED FOR FIREBASE AUTH
                  webSettings.setMediaPlaybackRequiresUserGesture(false); // REQUIRED FOR YOUTUBE
                  
                  // Make YouTube Load Properly as Mobile version
                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Mobile Safari/537.36");
                  
                  webView.setWebViewClient(new WebViewClient() {
                      // Prevent links from opening in external browser
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return false;
                      }
                  });
                  
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

