name: Build Earnzio Pro Developer APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/assets
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.unity3d.ads:unity-ads:4.12.0'
          }
          EOF

          # DOWNLOAD SPLASH VIDEO & LOGO
          wget -O app/src/main/res/drawable/app_icon.jpg "https://res.cloudinary.com/ixxjuj5g/image/upload/v1790382703/20260926_003238.jpg"
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # ==========================================
          # 100% OFFLINE HTML + CSS + FIREBASE JS (PRO VERSION)
          # ==========================================
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
            <title>Earnzio Pro</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
              
              /* 🔵 LIGHT BLUE & WHITE GRADIENT THEME 🔵 */
              body { 
                margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
                background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
                background-attachment: fixed; color: #000; user-select: none; -webkit-user-select: none;
              }
              
              /* 🔴 CUSTOM PRO ALERT MODAL 🔴 */
              #customAlert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
              .alert-box { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: scaleUp 0.3s ease; border: 2px solid #bae6fd; }
              @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
              .alert-title { font-size: 22px; font-weight: 900; margin-bottom: 10px; color: #0369a1; }
              .alert-msg { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: bold; }
              .alert-btn { background: #0284c7; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 900; font-size: 18px; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(2,132,199,0.3); }

              /* LOADING SPINNER */
              #globalSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
              .spinner { width: 50px; height: 50px; border: 5px solid #bae6fd; border-top-color: #0284c7; border-radius: 50%; animation: spin 1s linear infinite; }
              @keyframes spin { to { transform: rotate(360deg); } }
              .spinner-text { margin-top: 15px; font-weight: 900; color: #0284c7; font-size: 18px; }

              /* AUTHENTICATION SCREEN */
              #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 30px; box-sizing: border-box; }
              .auth-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
              .auth-title { font-size: 32px; font-weight: 900; color: #0369a1; margin-bottom: 10px; text-transform: uppercase; }
              
              .input-wrapper { position: relative; width: 100%; }
              .auth-input { width: 100%; padding: 18px; border: 2px solid #7dd3fc; border-radius: 10px; font-size: 16px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.8); font-weight: bold; color: #000; }
              .auth-input:focus { border-color: #0284c7; background: white; }
              .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 20px; cursor: pointer; }

              .auth-btn { background: #0284c7; color: white; width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(2,132,199,0.3); transition: 0.2s; }
              .auth-switch { color: #0369a1; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; text-decoration: underline; }

              /* MAIN APP */
              #main-app { display: none; padding-bottom: 80px; }
              .top-bar { display: flex; justify-content: flex-end; padding: 15px; }
              .coin-box { background: white; padding: 8px 15px; border-radius: 8px; border: 2px solid #bae6fd; font-weight: 900; font-size: 20px; color: #059669; display: flex; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
              .tab-content { display: none; padding: 10px; animation: fadeIn 0.3s ease; }
              .tab-content.active { display: block; }
              
              /* HOME */
              .daily-claim-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid #bae6fd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
              .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
              .day-box { background: #f0f9ff; border: 2px solid #7dd3fc; border-radius: 8px; width: 12%; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color:#0369a1; }
              .day-box.claimed { background: #059669; color: white; border-color: #059669; }
              .claim-btn { background: #ef4444; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; }
              .task-card { background: white; border: 2px solid #bae6fd; border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
              .task-title { font-size: 22px; font-weight: 900; margin: 15px 0 10px 0; color: #0369a1; }
              .start-btn { background: #f0f9ff; border: 2px solid #38bdf8; padding: 10px 30px; border-radius: 8px; font-size: 20px; font-weight: 900; color: #0284c7; cursor: pointer; }

              /* CAPTCHA */
              .submit-btn { background: #059669; color: white; width: 100%; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: 900; border: none; cursor: pointer; margin-bottom:10px; }
              .captcha-box { background: #f0f9ff; padding: 30px 20px; text-align: center; font-size: 28px; font-family: 'Courier New', monospace; font-weight: 900; letter-spacing: 8px; border: 2px dashed #0284c7; margin: 20px 0; border-radius: 8px; color:#0369a1;}
              .captcha-input { width: 100%; padding: 15px; border: 2px solid #bae6fd; border-radius: 8px; font-size: 18px; text-align: center; margin-bottom: 20px; box-sizing: border-box; font-weight: bold; outline:none; }
              
              /* 🔴 YOUTUBE WATCH TAB (PRO DESIGN) 🔴 */
              .yt-search-container { display: flex; gap: 10px; margin-bottom: 15px; }
              .yt-search-input { flex: 1; padding: 12px; border: 2px solid #bae6fd; border-radius: 8px; font-size: 16px; font-weight: bold; outline: none; background: white; }
              .yt-search-btn { background: #ef4444; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; }
              .yt-result-container { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #bae6fd; background: #000; }
              .yt-frame { width: 100%; height: 60vh; border: none; background: #000; }

              /* PROFILE TAB */
              .pro-header { margin-bottom: 15px; }
              .pro-name { background: white; padding: 15px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: 900; font-size: 18px; text-align: center; color:#0369a1; text-transform: uppercase; margin-bottom:10px;}
              .id-box { background: #0284c7; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; margin-bottom: 10px; }
              .pass-box { background: #ef4444; color: white; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; margin-bottom: 15px; letter-spacing: 1px; }
              
              .pro-wallet { background: #0369a1; color: white; text-align: center; padding: 20px; border-radius: 10px; font-size: 45px; font-weight: 900; margin-bottom: 15px; border:3px solid #7dd3fc; }
              .menu-item { background: white; padding: 15px 20px; border: 2px solid #bae6fd; border-radius: 8px; margin-bottom: 10px; font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; cursor: pointer; color:#0369a1; }
              
              .inline-section { display: none; background: rgba(255,255,255,0.9); padding: 15px; border: 2px dashed #38bdf8; border-radius: 8px; margin-bottom: 10px; }
              .w-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
              .w-tab { flex: 1; background: white; text-align: center; padding: 10px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 14px; color:#0369a1;}
              .w-tab.active { background: #e0f2fe; border-color:#0284c7; }
              .w-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #bae6fd; border-radius: 8px; font-weight: bold; box-sizing: border-box; outline:none; }
              
              .tx-box { padding: 10px; border-radius: 8px; border: 2px solid #bae6fd; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; background:white; color:#0c4a6e;}
              .tx-suc { border-left: 5px solid #059669; }

              /* BOTTOM NAV */
              .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
              .nav-icon { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; color: #333; }
              .nav-icon svg { width: 28px; height: 28px; fill: currentColor; }
              .nav-icon.active { color: #0284c7; transform: scale(1.15); }
            </style>
            
            <!-- 🔥 FIREBASE SDK SETUP 🔥 -->
            <script type="module">
              import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
              import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
              import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

              // 🔴 FIREBASE CONFIG 🔴
              const firebaseConfig = {
                apiKey: "AIzaSyAZLSUcRB160A4L7_Cf9erbnIBKEiRwAo4",
                authDomain: "earnzio-in.firebaseapp.com",
                databaseURL: "https://earnzio-in-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "earnzio-in",
                storageBucket: "earnzio-in.firebasestorage.app",
                messagingSenderId: "935935737332",
                appId: "1:935935737332:web:70bc35401fb05995274da1"
              };

              const app = initializeApp(firebaseConfig);
              const auth = getAuth(app);
              const db = getDatabase(app);

              let currentUser = null;
              let currentCoins = 0;
              let forceLogoutForRegister = false; // Flag to stop auto-login

              onAuthStateChanged(auth, (user) => {
                if (user) {
                  if (forceLogoutForRegister) {
                      // Pro Flow: If just registered, force them out to show success message and login manually
                      signOut(auth);
                      forceLogoutForRegister = false;
                      return;
                  }
                  currentUser = user;
                  document.getElementById('globalSpinner').style.display = 'none';
                  document.getElementById('auth-screen').style.display = 'none';
                  document.getElementById('main-app').style.display = 'block';
                  fetchUserData(user.uid);
                } else {
                  currentUser = null;
                  document.getElementById('globalSpinner').style.display = 'none';
                  document.getElementById('auth-screen').style.display = 'flex';
                  document.getElementById('main-app').style.display = 'none';
                }
              });

              // PRO DEVELOPER ALERT FUNCTION
              window.showAlert = function(title, msg, callback) {
                  document.getElementById('alertTitle').innerText = title;
                  document.getElementById('alertMsg').innerHTML = msg;
                  document.getElementById('customAlert').style.display = 'flex';
                  document.getElementById('alertBtn').onclick = function() {
                      document.getElementById('customAlert').style.display = 'none';
                      if(callback) callback();
                  };
              };

              window.doAuth = function(type) {
                const name = document.getElementById('authName').value.trim();
                const mobile = document.getElementById('authMobile').value.trim();
                const pass = document.getElementById('authPass').value.trim();
                
                if(!mobile || !pass) { showAlert("Error", "Mobile Number & Password are required!"); return; }
                if(type === 'register' && !name) { showAlert("Error", "Please enter your Full Name!"); return; }
                
                document.getElementById('globalSpinner').style.display = 'flex';
                document.getElementById('spinnerText').innerText = type === 'login' ? 'Authenticating...' : 'Creating Account...';

                const dummyEmail = mobile + "@earnzio.app";

                if(type === 'login') {
                  signInWithEmailAndPassword(auth, dummyEmail, pass).catch((e) => {
                    document.getElementById('globalSpinner').style.display = 'none';
                    // 🔥 Professional Error Handling 🔥
                    if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
                        showAlert("Login Failed", "User not found! Please register an account first.");
                    } else if (e.code === 'auth/wrong-password') {
                        showAlert("Incorrect Details", "You entered a wrong password! Please check and try again.");
                    } else {
                        showAlert("Error", "Login Failed. Check your Mobile number & Password.");
                    }
                  });
                } else {
                  forceLogoutForRegister = true; // Prevents auto-login
                  createUserWithEmailAndPassword(auth, dummyEmail, pass)
                    .then((cred) => {
                      const randomId = "ER" + Math.floor(100000 + Math.random() * 900000);
                      
                      set(ref(db, 'users/' + cred.user.uid), { 
                        name: name, mobile: mobile, password: pass, uniqueId: randomId, coins: 12.5, lastClaimDate: "" 
                      }).then(() => {
                          document.getElementById('globalSpinner').style.display = 'none';
                          
                          // Pro Success Modal & Switch to Login
                          let successMsg = "Your account is successfully created!<br><br>";
                          successMsg += "<b style='color:#0369a1;'>Your ID:</b> " + randomId + "<br>";
                          successMsg += "<b style='color:#0369a1;'>Password:</b> " + pass + "<br><br>";
                          successMsg += "Please Login to continue.";
                          
                          showAlert("✅ Registration Successful!", successMsg, () => {
                              document.getElementById('authName').value = "";
                              document.getElementById('authPass').value = "";
                              if(!isLogin) toggleAuthMode(); 
                          });
                      });
                    }).catch((e) => {
                      forceLogoutForRegister = false;
                      document.getElementById('globalSpinner').style.display = 'none';
                      if(e.code === 'auth/email-already-in-use') {
                          showAlert("Error", "This Mobile Number is already registered! Please go to Login.");
                      } else {
                          showAlert("Error", e.message);
                      }
                    });
                }
              };

              window.logout = function() { signOut(auth); };

              function fetchUserData(uid) {
                get(ref(db, 'users/' + uid)).then((snapshot) => {
                  if (snapshot.exists()) {
                    const data = snapshot.val();
                    currentCoins = data.coins || 0;
                    
                    document.getElementById('proName').innerText = "👤 " + data.name;
                    document.getElementById('proMobile').innerText = "📱 ID: " + (data.uniqueId ? data.uniqueId : "ER" + data.mobile.substring(0,6));
                    document.getElementById('proPassword').innerText = "🔑 Password: " + data.password;
                    
                    updateUI();
                  }
                });
              }

              window.addCoins = function(amount) {
                if(!currentUser) return;
                currentCoins += amount;
                update(ref(db, 'users/' + currentUser.uid), { coins: currentCoins });
                updateUI();
              };

              function updateUI() {
                document.querySelectorAll('.bal-txt').forEach(el => el.innerText = currentCoins.toFixed(1));
              }

              window.claimDaily = function() {
                if(!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                get(ref(db, 'users/' + currentUser.uid + '/lastClaimDate')).then((snap) => {
                  if(snap.exists() && snap.val() === today) {
                    showAlert("Notice", "You have already claimed today's bonus! Come back tomorrow.");
                  } else {
                    currentCoins += 5.0;
                    update(ref(db, 'users/' + currentUser.uid), { coins: currentCoins, lastClaimDate: today });
                    updateUI();
                    showAlert("Success!", "Daily Bonus Claimed! +5 Coins added to your wallet.");
                  }
                });
              };
            </script>
          </head>
          <body>

            <!-- PRO CUSTOM ALERT MODAL -->
            <div id="customAlert">
              <div class="alert-box">
                <div class="alert-title" id="alertTitle">Alert</div>
                <div class="alert-msg" id="alertMsg">Message goes here</div>
                <button class="alert-btn" id="alertBtn">OK</button>
              </div>
            </div>

            <!-- GLOBAL SPINNER -->
            <div id="globalSpinner">
              <div class="spinner"></div>
              <div class="spinner-text" id="spinnerText">Please wait...</div>
            </div>

            <!-- AUTH SCREEN -->
            <div id="auth-screen">
              <div class="auth-container">
                <div class="auth-title" id="authTitle">LOGIN</div>
                
                <input type="text" id="authName" class="auth-input" placeholder="Full Name" style="display:none;">
                <input type="number" id="authMobile" class="auth-input" placeholder="Mobile Number">
                
                <div class="input-wrapper">
                  <input type="password" id="authPass" class="auth-input" placeholder="Password (Min 6 chars)">
                  <span class="eye-icon" onclick="togglePassword()">👁️</span>
                </div>

                <button class="auth-btn" id="authBtn" onclick="doAuth('login')">LOGIN TO ACCOUNT</button>
                <div class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">Don't have an account? Register Here</div>
              </div>
            </div>

            <!-- MAIN APP -->
            <div id="main-app">
              <div class="top-bar"><div class="coin-box">🪙 <span class="bal-txt">0.0</span></div></div>

              <div id="tab-home" class="tab-content active">
                <div class="daily-claim-box">
                  <div class="days-row">
                    <div class="day-box">1</div><div class="day-box">2</div><div class="day-box">3</div>
                    <div class="day-box">4</div><div class="day-box">5</div><div class="day-box">6</div><div class="day-box">7</div>
                  </div>
                  <button class="claim-btn" onclick="claimDaily()">CLAIM DAILY BONUS</button>
                </div>
                <div class="task-card">
                  <div class="task-title">Solve Captcha</div>
                  <div class="start-btn" onclick="openCaptcha()">▶ START</div>
                </div>
              </div>

              <!-- CAPTCHA TAB -->
              <div id="tab-captcha" class="tab-content">
                <h2 style="text-align:center; color:#0369a1;">Solve Captcha</h2>
                <div class="captcha-box" id="capText">A7X9P</div>
                <input type="text" class="captcha-input" id="capInput" placeholder="ENTER TEXT HERE">
                <button class="submit-btn" onclick="submitCaptcha()">SUBMIT CAPTCHA</button>
                <button class="submit-btn" style="background:#0284c7;" onclick="nav('home')">BACK TO HOME</button>
              </div>

              <!-- 🔴 WATCH TAB (Fixed YouTube Error 152/153) 🔴 -->
              <div id="tab-watch" class="tab-content">
                <div class="yt-search-container">
                  <input type="text" id="ytSearchBox" class="yt-search-input" placeholder="Search Videos (e.g. Telugu Songs)">
                  <button class="yt-search-btn" onclick="searchYoutube()">Search</button>
                </div>
                <div class="yt-result-container">
                  <!-- Note: Origin is set dynamically in Android to fix errors -->
                  <iframe id="ytPlayer" class="yt-frame" src="https://www.youtube.com/embed?listType=search&list=telugu+latest+movies" allowfullscreen></iframe>
                </div>
              </div>

              <!-- PROFILE TAB -->
              <div id="tab-profile" class="tab-content">
                <div class="pro-header">
                  <div class="pro-name" id="proName">👤 Name</div>
                </div>
                <div class="id-box" id="proMobile">📱 ID: ERXXXXXX</div>
                <div class="pass-box" id="proPassword">🔑 Password: ******</div>
                
                <div class="pro-wallet">🪙 <span class="bal-txt">0.0</span></div>
                
                <div class="menu-item" onclick="toggleSection('withdrawSec')">💳 WITHDRAWAL <span>▼</span></div>
                
                <div id="withdrawSec" class="inline-section">
                  <div class="w-tabs">
                    <div class="w-tab active" id="tabBank" onclick="selW('bank')">BANK 🏦</div>
                    <div class="w-tab" id="tabUpi" onclick="selW('upi')">UPI ID</div>
                  </div>
                  <div id="w-form-bank">
                    <input type="text" class="w-input" placeholder="BANK NAME">
                    <input type="number" class="w-input" placeholder="ACCOUNT NUMBER">
                  </div>
                  <div id="w-form-upi" style="display:none;"><input type="text" class="w-input" placeholder="ENTER UPI ID"></div>
                  <input type="number" class="w-input" placeholder="Amount" style="border-color:#0284c7;">
                  <button class="submit-btn" onclick="showAlert('Success', 'Withdrawal Request Submitted!')">SUBMIT</button>
                </div>

                <div class="menu-item" onclick="toggleSection('txSec')">📜 TRANSACTIONS <span>▼</span></div>
                
                <div id="txSec" class="inline-section">
                  <div class="tx-box tx-pen"><span>Pending Request</span> <span>🪙 12.5</span></div>
                  <div class="tx-box tx-suc"><span>Success</span> <span>🪙 60</span></div>
                </div>

                <div class="menu-item" onclick="logout()" style="color:#ef4444; border-color:#ef4444;">🚪 LOGOUT <span>➜</span></div>
              </div>

              <!-- BOTTOM NAV -->
              <div class="bottom-nav">
                <div class="nav-icon active" id="nav-home" onclick="nav('home')">
                  <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </div>
                <div class="nav-icon" id="nav-watch" onclick="nav('watch')">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="nav-icon" id="nav-profile" onclick="nav('profile')">
                  <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
              </div>
            </div>

            <script>
              let isLogin = true;
              function toggleAuthMode() {
                isLogin = !isLogin;
                document.getElementById('authTitle').innerText = isLogin ? "LOGIN" : "REGISTER";
                document.getElementById('authBtn').innerText = isLogin ? "LOGIN TO ACCOUNT" : "CREATE ACCOUNT";
                document.getElementById('authBtn').setAttribute('onclick', isLogin ? "doAuth('login')" : "doAuth('register')");
                document.getElementById('authSwitch').innerText = isLogin ? "Don't have an account? Register Here" : "Already have an account? Login";
                document.getElementById('authName').style.display = isLogin ? "none" : "block";
              }

              // 👁️ EYE ICON FOR PASSWORD
              function togglePassword() {
                const passInput = document.getElementById('authPass');
                if (passInput.type === "password") {
                  passInput.type = "text";
                } else {
                  passInput.type = "password";
                }
              }

              function nav(tab) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');
                if(tab === 'home' || tab === 'watch' || tab === 'profile') {
                  document.getElementById('nav-' + tab).classList.add('active');
                }
              }

              function toggleSection(id) {
                const sec = document.getElementById(id);
                if(sec.style.display === 'block') { sec.style.display = 'none'; } 
                else {
                  document.getElementById('withdrawSec').style.display = 'none';
                  document.getElementById('txSec').style.display = 'none';
                  sec.style.display = 'block';
                }
              }

              function selW(type) {
                document.getElementById('tabBank').classList.remove('active');
                document.getElementById('tabUpi').classList.remove('active');
                document.getElementById('w-form-bank').style.display = 'none';
                document.getElementById('w-form-upi').style.display = 'none';
                if(type === 'bank') {
                  document.getElementById('tabBank').classList.add('active');
                  document.getElementById('w-form-bank').style.display = 'block';
                } else {
                  document.getElementById('tabUpi').classList.add('active');
                  document.getElementById('w-form-upi').style.display = 'block';
                }
              }

              // 🔴 YOUTUBE SEARCH FIX 🔴
              function searchYoutube() {
                const query = document.getElementById('ytSearchBox').value.trim();
                if(!query) return;
                // Add origin to fix restriction errors
                const embedUrl = "https://www.youtube.com/embed?listType=search&list=" + encodeURIComponent(query) + "&origin=https://earnzio.com";
                document.getElementById('ytPlayer').src = embedUrl;
              }

              // CAPTCHA
              let curCap = "";
              function genCap() {
                const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; curCap = "";
                for(let i=0; i<6; i++) curCap += c.charAt(Math.floor(Math.random()*c.length));
                document.getElementById('capText').innerText = curCap;
                document.getElementById('capInput').value = "";
              }
              function openCaptcha() { nav('captcha'); genCap(); }
              function submitCaptcha() {
                if(document.getElementById('capInput').value.trim().toUpperCase() === curCap) {
                  addCoins(1.5); showAlert("Success", "Correct! +1.5 Coins Added"); nav('home');
                } else { showAlert("Error", "Wrong Captcha! Try again."); genCap(); }
              }
            </script>
          </body>
          </html>
          EOF

