name: Build EARNZIO APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.9.0'
          }
          EOF

          # APP ICON
          wget -O app/src/main/res/drawable/app_icon.png "https://i.ibb.co/JRdfgm0T/116103-100kb.jpg"

          # FILE PROVIDER
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_media" path="media/"/>
          </paths>
          EOF
          
          # THEME
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          
          # MANIFEST (ONLY INTERNET, NETWORK STATE, AND PHONE STATE PERMISSIONS)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Required Permissions ONLY -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" /> 
              
              <application android:label="Earnzio" android:icon="@drawable/app_icon" android:theme="@style/Theme.App" android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.earnzio.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
          
          # MAIN ACTIVITY JAVA CODE
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.telephony.TelephonyManager;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private ValueCallback<Uri[]> mFilePathCallback;
              private final static int FILECHOOSER_RESULTCODE = 1;
              private WebAppInterface webAppInterface;
              private WebView webView;
              
              private Dialog progressDialog;
              private TextView progressText;

              private boolean isNetworkAvailable() {
                  ConnectivityManager connectivityManager = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (connectivityManager != null) {
                      NetworkInfo activeNetworkInfo = connectivityManager.getActiveNetworkInfo();
                      return activeNetworkInfo != null && activeNetworkInfo.isConnected();
                  }
                  return false;
              }

              private void showOfflinePage(WebView view) {
                  String customErrorPage = "<html><body style=\"display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; background-color:#ffffff; color:#002A5C; text-align:center;\"><h2 style=\"font-weight:900; font-size:24px; padding:20px;\">PLEASE CONNECT YOUR INTERNET 🌐</h2><p style=\"font-size:14px; font-weight:bold; color:#10b981; margin-top:30px;\">POWERED BY EARNZIO</p></body></html>";
                  view.loadDataWithBaseURL(null, customErrorPage, "text/html", "UTF-8", null);
              }
              
              private void initProgressDialog() {
                  progressDialog = new Dialog(this);
                  progressDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  progressDialog.setCancelable(false);
                  
                  if (progressDialog.getWindow() != null) {
                      progressDialog.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      progressDialog.getWindow().setDimAmount(0.7f);
                  }
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.TRANSPARENT);
                  
                  ProgressBar progressBar = new ProgressBar(this);
                  progressBar.getIndeterminateDrawable().setColorFilter(Color.WHITE, android.graphics.PorterDuff.Mode.MULTIPLY);
                  layout.addView(progressBar);
                  
                  progressText = new TextView(this);
                  progressText.setText("Preparing...");
                  progressText.setTextColor(Color.WHITE);
                  progressText.setTextSize(16);
                  progressText.setPadding(0, 30, 0, 0);
                  progressText.setTypeface(null, Typeface.BOLD);
                  progressText.setGravity(Gravity.CENTER);
                  layout.addView(progressText);
                  
                  progressDialog.setContentView(layout);
              }

              // REQUEST ONLY PHONE STATE PERMISSION
              private void requestRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] permissions = {
                          Manifest.permission.READ_PHONE_STATE 
                      };
                      requestPermissions(permissions, 1);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 🔥 SCREENSHOTS ENABLED: getWindow().setFlags(FLAG_SECURE) has been completely removed 🔥
                  
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE); 
                  setContentView(webView);
                  
                  requestRequiredPermissions();
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false); 
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  
                  String customUserAgent = "Mozilla/5.0 (Linux; Android 12; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36";
                  webSettings.setUserAgentString(customUserAgent);

                  CookieManager.getInstance().setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  }

                  webAppInterface = new WebAppInterface(this);
                  webView.addJavascriptInterface(webAppInterface, "AndroidApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) { showOfflinePage(view); }
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          showOfflinePage(view);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          
                          // Inject Device ID to LocalStorage
                          String deviceId = webAppInterface.getDeviceId();
                          String jsToInject = "javascript:(function(){ localStorage.setItem('deviceId', '" + deviceId + "'); })();";
                          view.evaluateJavascript(jsToInject, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) { return false; }
                          
                          if (url.startsWith("intent://")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  if (intent != null) {
                                      if (getPackageManager().resolveActivity(intent, 0) == null) {
                                          String fallbackUrl = intent.getStringExtra("browser_fallback_url");
                                          if (fallbackUrl != null) { view.loadUrl(fallbackUrl); return true; }
                                      }
                                      startActivity(intent);
                                      return true;
                                  }
                              } catch (Exception e) { return true; }
                          } else if (url.startsWith("upi://") || url.startsWith("paytmmp://") || url.startsWith("tez://") || url.startsWith("phonepe://") || url.startsWith("whatsapp://")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  Toast.makeText(getApplicationContext(), "App not installed", Toast.LENGTH_SHORT).show();
                                  return true;
                              }
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (mFilePathCallback != null) mFilePathCallback.onReceiveValue(null);
                          mFilePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select File"), FILECHOOSER_RESULTCODE);
                          return true;
                      }
                  });

                  if (!isNetworkAvailable()) {
                      showOfflinePage(webView);
                  } else {
                      webView.loadUrl("https://earnzio-org.blogspot.com/");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (mFilePathCallback == null) return;
                      Uri[] result = intent == null || resultCode != RESULT_OK ? null : new Uri[]{intent.getData()};
                      mFilePathCallback.onReceiveValue(result);
                      mFilePathCallback = null;
                  }
              }

              public class WebAppInterface {
                  Context mContext;

                  WebAppInterface(Context c) { mContext = c; }
                  
                  // This gets a unique ID for the device
                  @JavascriptInterface
                  @SuppressLint("HardwareIds")
                  public String getDeviceId() {
                      return Settings.Secure.getString(mContext.getContentResolver(), Settings.Secure.ANDROID_ID);
                  }

                  @JavascriptInterface
                  public void showToast(String message) {
                      ((Activity) mContext).runOnUiThread(() -> Toast.makeText(mContext, message, Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNZIO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
