          # MAIN ACTIVITY (YOUTUBE ERROR 153/152 BASE URL FIX PRO)
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.VideoView;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;
          import java.util.Scanner;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private VideoView splashVideo;
              private ImageView splashLogo;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  splashVideo = findViewById(R.id.splashVideo);
                  splashLogo = findViewById(R.id.splashLogo);
                  
                  // 🔥 SPLASH SCREEN 🔥
                  Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.splash_video);
                  splashVideo.setVideoURI(videoUri);
                  splashVideo.setOnPreparedListener(mp -> {
                      mp.setLooping(false);
                      mp.setOnInfoListener((mp1, what, extra) -> {
                          if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                              splashLogo.setVisibility(View.GONE);
                              return true;
                          }
                          return false;
                      });
                      splashVideo.start();
                  });
                  splashVideo.setOnCompletionListener(mp -> {
                      splashVideo.setVisibility(View.GONE);
                      splashLogo.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  });
                  
                  // 🔥 WEBVIEW SETUP 🔥
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true); 
                  webSettings.setMediaPlaybackRequiresUserGesture(false); 
                  
                  webView.setWebViewClient(new WebViewClient());

                  // 🔴 PRO YOUTUBE EMBED FIX 🔴
                  try {
                      InputStream is = getAssets().open("index.html");
                      Scanner s = new Scanner(is).useDelimiter("\\A");
                      String html = s.hasNext() ? s.next() : "";
                      
                      // Using custom domain as BaseURL fully bypasses YouTube Error 152/153 in WebView
                      webView.loadDataWithBaseURL("https://earnzio.com", html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

