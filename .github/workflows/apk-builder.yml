name: Build EARNZIO APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/layout
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          # Added AdMob Dependency here
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.9.0'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          # APP ICON
          wget -O app/src/main/res/drawable/app_icon.png "https://res.cloudinary.com/ixxjuj5g/image/upload/v1790382703/20260926_003238.jpg"

          # SPLASH VIDEO 
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # FILE PROVIDER
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_media" path="media/"/>
          </paths>
          EOF
          
          # THEME
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#ffffff</item>
              </style>
          </resources>
          EOF
          
          # MANIFEST (Added AdMob App ID & AdActivity)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" /> 
              <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              
              <application android:label="Earnzio" android:icon="@drawable/app_icon" android:theme="@style/Theme.App" android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  
                  <!-- Sample AdMob App ID (Replace with yours later) -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>

                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.earnzio.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          # ALARM RECEIVER
          cat << 'EOF' > app/src/main/java/com/earnzio/app/AlarmReceiver.java
          package com.earnzio.app;
          
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("EARNZIO_ALERTS", "Earnzio Alerts", NotificationManager.IMPORTANCE_HIGH);
                      nm.createNotificationChannel(channel);
                  }
                  Intent i = new Intent(context, MainActivity.class);
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  PendingIntent pi = PendingIntent.getActivity(context, 0, i, PendingIntent.FLAG_IMMUTABLE);
                  
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "EARNZIO_ALERTS")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle("Daily Earnings waiting! 💰")
                          .setContentText("Open the app now to claim your daily coins!")
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setDefaults(NotificationCompat.DEFAULT_ALL);
                          
                  nm.notify(101, builder.build());
              }
          }
          EOF

          # MAIN ACTIVITY LAYOUT (XML)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#ffffff">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <VideoView
                  android:id="@+id/videoView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center" />

              <ImageView
                  android:id="@+id/splashPlaceholder"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#ffffff" />

              <ProgressBar
                  android:id="@+id/nativeSpinner"
                  android:layout_width="50dp"
                  android:layout_height="50dp"
                  android:layout_gravity="center"
                  android:visibility="gone"
                  android:indeterminateTint="#10b981" />

          </FrameLayout>
          EOF
          
          # MAIN ACTIVITY JAVA CODE (WITH ADMOB LOGIC)
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.MediaPlayer;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.Log;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import android.widget.VideoView;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          
          // AdMob Imports
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;

          import java.util.Calendar;

          public class MainActivity extends AppCompatActivity {
              private WebAppInterface webAppInterface;
              private WebView webView;
              private VideoView videoView;
              private ImageView splashPlaceholder;
              private ProgressBar nativeSpinner;
              
              private RewardedAd rewardedAd;
              private final String TAG = "MainActivity";
              
              // Sample Test Ad Unit ID (Replace with your Real AdMob Unit ID later)
              private final String AD_UNIT_ID = "ca-app-pub-3940256099942544/5224354917"; 

              private void loadRewardedAd() {
                  AdRequest adRequest = new AdRequest.Builder().build();
                  RewardedAd.load(this, AD_UNIT_ID, adRequest, new RewardedAdLoadCallback() {
                      @Override
                      public void onAdFailedToLoad(@NonNull LoadAdError loadAdError) {
                          rewardedAd = null;
                      }
                      @Override
                      public void onAdLoaded(@NonNull RewardedAd ad) {
                          rewardedAd = ad;
                      }
                  });
              }

              private boolean isNetworkAvailable() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm != null) {
                      NetworkInfo activeNetwork = cm.getActiveNetworkInfo();
                      return activeNetwork != null && activeNetwork.isConnected();
                  }
                  return false;
              }

              private void showOfflinePage(WebView view) {
                  String customErrorPage = "<html><body style=\"display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; background-color:#ffffff; color:#002A5C; text-align:center;\"><h2 style=\"font-weight:900; font-size:24px; padding:20px;\">PLEASE CONNECT YOUR INTERNET 🌐</h2><p style=\"font-size:14px; font-weight:bold; color:#10b981; margin-top:30px;\">POWERED BY EARNZIO</p></body></html>";
                  view.loadDataWithBaseURL(null, customErrorPage, "text/html", "UTF-8", null);
              }
              
              private void requestRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          requestPermissions(new String[]{ Manifest.permission.READ_PHONE_STATE, Manifest.permission.POST_NOTIFICATIONS }, 1);
                      } else {
                          requestPermissions(new String[]{ Manifest.permission.READ_PHONE_STATE }, 1);
                      }
                  }
              }

              private void scheduleDailyNotification() {
                  AlarmManager alarmManager = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(this, AlarmReceiver.class);
                  PendingIntent pendingIntent = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  
                  Calendar calendar = Calendar.getInstance();
                  calendar.set(Calendar.HOUR_OF_DAY, 5);
                  calendar.set(Calendar.MINUTE, 0);
                  calendar.set(Calendar.SECOND, 0);
                  
                  if (calendar.getTimeInMillis() <= System.currentTimeMillis()) {
                      calendar.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  
                  if (alarmManager != null) {
                      alarmManager.setRepeating(AlarmManager.RTC_WAKEUP, calendar.getTimeInMillis(), AlarmManager.INTERVAL_DAY, pendingIntent);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Initialize AdMob
                  MobileAds.initialize(this, initializationStatus -> {
                      loadRewardedAd();
                  });

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                      window.setStatusBarColor(Color.WHITE);
                      window.setNavigationBarColor(Color.WHITE);
                      int flags = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }
                      window.getDecorView().setSystemUiVisibility(flags);
                  }

                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  videoView = findViewById(R.id.videoView);
                  splashPlaceholder = findViewById(R.id.splashPlaceholder);
                  nativeSpinner = findViewById(R.id.nativeSpinner);
                  
                  requestRequiredPermissions();
                  scheduleDailyNotification(); 
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setMediaPlaybackRequiresUserGesture(false); 
                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 12; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36");

                  CookieManager.getInstance().setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  }

                  webAppInterface = new WebAppInterface(this);
                  webView.addJavascriptInterface(webAppInterface, "AndroidApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) { showOfflinePage(view); }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          String deviceId = webAppInterface.getDeviceId();
                          String jsToInject = "javascript:(function(){ localStorage.setItem('deviceId', '" + deviceId + "'); window.isNativeApp = true; })();";
                          view.evaluateJavascript(jsToInject, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          
                          if (url.startsWith("https://api.whatsapp.com/") || url.startsWith("https://wa.me/") || url.startsWith("whatsapp://")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  intent.setPackage("com.whatsapp"); 
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  try {
                                      Intent fallbackIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(fallbackIntent);
                                      return true;
                                  } catch (Exception e2) {
                                      Toast.makeText(getApplicationContext(), "WhatsApp is not installed", Toast.LENGTH_SHORT).show();
                                      return true;
                                  }
                              }
                          }
                          if (url.startsWith("http://") || url.startsWith("https://")) { return false; }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  if (!isNetworkAvailable()) {
                      showOfflinePage(webView);
                  } else {
                      webView.loadUrl("https://earnzio-org.blogspot.com/"); // Blogger URL
                  }
                  
                  int videoResId = getResources().getIdentifier("splash_video", "raw", getPackageName());
                  if(videoResId != 0) {
                      Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + videoResId);
                      videoView.setVideoURI(videoUri);
                      
                      videoView.setOnPreparedListener(mp -> {
                          mp.setVolume(0f, 0f);
                          mp.setLooping(false);
                          mp.setVideoScalingMode(MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING);
                          
                          mp.setOnInfoListener((mediaPlayer, what, extra) -> {
                              if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                                  splashPlaceholder.setVisibility(View.GONE);
                                  return true;
                              }
                              return false;
                          });
                          
                          videoView.start();
                      });
                      
                      videoView.setOnCompletionListener(mp -> {
                          videoView.setVisibility(View.GONE);
                          splashPlaceholder.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          nativeSpinner.setVisibility(View.VISIBLE); 
                      });
                      
                      videoView.setOnErrorListener((mp, what, extra) -> {
                          videoView.setVisibility(View.GONE);
                          splashPlaceholder.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          return true;
                      });
                  } else {
                      videoView.setVisibility(View.GONE);
                      splashPlaceholder.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  }
              }

              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  @SuppressLint("HardwareIds")
                  public String getDeviceId() {
                      return Settings.Secure.getString(mContext.getContentResolver(), Settings.Secure.ANDROID_ID);
                  }

                  @JavascriptInterface
                  public void appReadyToDisplay() {
                      ((Activity) mContext).runOnUiThread(() -> {
                          if(nativeSpinner != null) {
                              nativeSpinner.setVisibility(View.GONE);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showToast(String message) {
                      ((Activity) mContext).runOnUiThread(() -> Toast.makeText(mContext, message, Toast.LENGTH_SHORT).show());
                  }

                  // 🔥 THIS IS CALLED FROM BLOGGER WHEN "WATCH AD" IS CLICKED 🔥
                  @JavascriptInterface
                  public void playAdMobVideo(String type) {
                      ((Activity) mContext).runOnUiThread(() -> {
                          if (rewardedAd != null) {
                              rewardedAd.setFullScreenContentCallback(new FullScreenContentCallback() {
                                  @Override
                                  public void onAdShowedFullScreenContent() { }
                                  @Override
                                  public void onAdFailedToShowFullScreenContent(AdError adError) {
                                      rewardedAd = null;
                                  }
                                  @Override
                                  public void onAdDismissedFullScreenContent() {
                                      rewardedAd = null;
                                      loadRewardedAd(); // Load next ad
                                  }
                              });

                              Activity activityContext = MainActivity.this;
                              rewardedAd.show(activityContext, rewardItem -> {
                                  // 🔥 AD COMPLETED! SEND SIGNAL BACK TO BLOGGER TO ADD COINS 🔥
                                  webView.evaluateJavascript("javascript:nativeAdCompleted('" + type + "');", null);
                              });
                          } else {
                              Toast.makeText(mContext, "Ad is still loading. Please try again in a few seconds.", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();
                          }
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNZIO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
