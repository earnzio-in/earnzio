name: Build EARNZIO APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/layout
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.9.0'
          }
          EOF

          # APP ICON
          wget -O app/src/main/res/drawable/app_icon.png "https://res.cloudinary.com/ixxjuj5g/image/upload/v1790382703/20260926_003238.jpg"

          # SPLASH VIDEO 
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # FILE PROVIDER
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_media" path="media/"/>
          </paths>
          EOF
          
          # THEME
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          
          # MANIFEST
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Required Permissions ONLY -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" /> 
              
              <application android:label="Earnzio" android:icon="@drawable/app_icon" android:theme="@style/Theme.App" android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.earnzio.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # MAIN ACTIVITY LAYOUT (XML)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#ffffff">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <VideoView
                  android:id="@+id/videoView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center" />

              <!-- 🔥 This white view covers the black screen until video is 100% ready to play 🔥 -->
              <ImageView
                  android:id="@+id/splashPlaceholder"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#ffffff" />

          </FrameLayout>
          EOF
          
          # MAIN ACTIVITY JAVA CODE
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.MediaPlayer;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.Toast;
          import android.widget.VideoView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebAppInterface webAppInterface;
              private WebView webView;
              private VideoView videoView;
              private ImageView splashPlaceholder;
              
              private boolean isNetworkAvailable() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm != null) {
                      NetworkInfo activeNetwork = cm.getActiveNetworkInfo();
                      return activeNetwork != null && activeNetwork.isConnected();
                  }
                  return false;
              }

              private void showOfflinePage(WebView view) {
                  String customErrorPage = "<html><body style=\"display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; background-color:#ffffff; color:#002A5C; text-align:center;\"><h2 style=\"font-weight:900; font-size:24px; padding:20px;\">PLEASE CONNECT YOUR INTERNET 🌐</h2><p style=\"font-size:14px; font-weight:bold; color:#10b981; margin-top:30px;\">POWERED BY EARNZIO</p></body></html>";
                  view.loadDataWithBaseURL(null, customErrorPage, "text/html", "UTF-8", null);
              }
              
              private void requestRequiredPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(new String[]{ Manifest.permission.READ_PHONE_STATE }, 1);
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                      window.setStatusBarColor(Color.WHITE);
                      window.setNavigationBarColor(Color.WHITE); // Fix for bottom black bar
                      int flags = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          flags |= View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                      }
                      window.getDecorView().setSystemUiVisibility(flags);
                  }

                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  videoView = findViewById(R.id.videoView);
                  splashPlaceholder = findViewById(R.id.splashPlaceholder);
                  
                  requestRequiredPermissions();
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  
                  // 🔥 THIS IS THE FIX FOR SOUNDS NOT PLAYING IN APP 🔥
                  webSettings.setMediaPlaybackRequiresUserGesture(false); 
                  
                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 12; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36");

                  CookieManager.getInstance().setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  }

                  webAppInterface = new WebAppInterface(this);
                  webView.addJavascriptInterface(webAppInterface, "AndroidApp");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) { showOfflinePage(view); }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          String deviceId = webAppInterface.getDeviceId();
                          String jsToInject = "javascript:(function(){ localStorage.setItem('deviceId', '" + deviceId + "'); })();";
                          view.evaluateJavascript(jsToInject, null);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          
                          if (url.startsWith("https://api.whatsapp.com/") || url.startsWith("https://wa.me/") || url.startsWith("whatsapp://")) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  intent.setPackage("com.whatsapp"); 
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  try {
                                      Intent fallbackIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(fallbackIntent);
                                      return true;
                                  } catch (Exception e2) {
                                      Toast.makeText(getApplicationContext(), "WhatsApp is not installed", Toast.LENGTH_SHORT).show();
                                      return true;
                                  }
                              }
                          }

                          if (url.startsWith("http://") || url.startsWith("https://")) { return false; }
                          
                          if (url.startsWith("intent://") || url.startsWith("upi://") || url.startsWith("paytmmp://") || url.startsWith("tez://") || url.startsWith("phonepe://")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  if (intent != null) {
                                      if (getPackageManager().resolveActivity(intent, 0) == null) {
                                          String fallbackUrl = intent.getStringExtra("browser_fallback_url");
                                          if (fallbackUrl != null) { view.loadUrl(fallbackUrl); return true; }
                                      }
                                      startActivity(intent);
                                      return true;
                                  }
                              } catch (Exception e) { return true; }
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  if (!isNetworkAvailable()) {
                      showOfflinePage(webView);
                  } else {
                      webView.loadUrl("https://earnzio-org.blogspot.com/");
                  }
                  
                  // 🔥 ZERO-MILLISECOND BLACK SCREEN VIDEO LOGIC 🔥
                  int videoResId = getResources().getIdentifier("splash_video", "raw", getPackageName());
                  if(videoResId != 0) {
                      Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + videoResId);
                      videoView.setVideoURI(videoUri);
                      
                      videoView.setOnPreparedListener(mp -> {
                          mp.setVolume(0f, 0f);
                          mp.setLooping(false);
                          mp.setVideoScalingMode(MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING);
                          
                          mp.setOnInfoListener((mediaPlayer, what, extra) -> {
                              if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                                  splashPlaceholder.setVisibility(View.GONE);
                                  return true;
                              }
                              return false;
                          });
                          
                          videoView.start();
                      });
                      
                      videoView.setOnCompletionListener(mp -> {
                          videoView.setVisibility(View.GONE);
                          splashPlaceholder.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                      });
                      
                      videoView.setOnErrorListener((mp, what, extra) -> {
                          videoView.setVisibility(View.GONE);
                          splashPlaceholder.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          return true;
                      });
                  } else {
                      videoView.setVisibility(View.GONE);
                      splashPlaceholder.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  }
              }

              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }
                  
                  @JavascriptInterface
                  @SuppressLint("HardwareIds")
                  public String getDeviceId() {
                      return Settings.Secure.getString(mContext.getContentResolver(), Settings.Secure.ANDROID_ID);
                  }

                  @JavascriptInterface
                  public void showToast(String message) {
                      ((Activity) mContext).runOnUiThread(() -> Toast.makeText(mContext, message, Toast.LENGTH_SHORT).show());
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNZIO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
