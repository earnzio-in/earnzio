name: Build Earnzio Pro Ultimate APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android App Code
        run: |
          mkdir -p app/src/main/java/com/earnzio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/assets
          
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.4.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.earnzio.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.earnzio.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.unity3d.ads:unity-ads:4.12.0'
          }
          EOF

          # DOWNLOAD SPLASH VIDEO & LOGO
          wget -O app/src/main/res/drawable/app_icon.jpg "https://res.cloudinary.com/ixxjuj5g/image/upload/v1790382703/20260926_003238.jpg"
          wget -O app/src/main/res/raw/splash_video.mp4 "https://res.cloudinary.com/ixxjuj5g/video/upload/v1790382792/InShot_20260926_054447616.mp4"

          # ==========================================
          # 100% OFFLINE HTML + CSS + JS (NO WEB LINKS)
          # ==========================================
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
            <title>Earnzio Professional</title>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
              
              body { 
                margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
                background: linear-gradient(135deg, #e6e9ff 0%, #b8c6ff 50%, #859aff 100%);
                background-attachment: fixed; color: #000; user-select: none; -webkit-user-select: none;
              }
              
              /* LOGIN & REGISTER SCREEN */
              #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }
              .auth-box { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); text-align: center; }
              .auth-title { font-size: 28px; font-weight: 900; color: #2e1065; margin-bottom: 20px; }
              .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
              .auth-input:focus { border-color: #15803d; }
              .auth-btn { background: #2e1065; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
              .auth-switch { color: #15803d; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: underline; }

              /* MAIN APP CONTAINER */
              #main-app { display: none; padding-bottom: 80px; }
              
              .top-bar { display: flex; justify-content: flex-end; padding: 15px; }
              .coin-box { background: white; padding: 5px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold; font-size: 20px; color: #15803d; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
              
              .tab-content { display: none; padding: 10px; animation: fadeIn 0.3s ease; }
              .tab-content.active { display: block; }
              @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

              /* HOME TAB */
              .daily-claim-box { background: rgba(255,255,255,0.8); border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: center; }
              .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
              .day-box { background: white; border: 2px solid #333; border-radius: 8px; width: 12%; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; }
              .claim-btn { background: #ef4444; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
              .task-card { background: rgba(255,255,255,0.7); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
              .task-title { font-size: 22px; font-weight: 900; margin: 15px 0 10px 0; color: #2e1065; }
              .start-btn { background: white; border: 2px solid #ddd; padding: 10px 30px; border-radius: 8px; font-size: 20px; font-weight: 900; color: #15803d; cursor: pointer; }

              /* YOUTUBE WATCH TAB */
              .yt-player-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; }
              .yt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
              .yt-thumb { width: 100%; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
              .yt-thumb:active { border-color: #ef4444; transform: scale(0.95); }
              .yt-title { font-size: 14px; font-weight: bold; text-align: center; margin-top: 5px; color: #333; }

              /* PROFILE TAB & INLINE WITHDRAWAL */
              .pro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
              .pro-name { background: white; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; font-size: 18px; flex-grow: 1; text-align: center; margin: 0 10px; }
              .id-box { background: #15803d; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; text-align: center; }
              .pro-wallet { background: #2e1065; color: white; text-align: center; padding: 20px; border-radius: 10px; font-size: 45px; font-weight: 900; margin-bottom: 15px; }
              
              .menu-item { background: white; padding: 15px 20px; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-weight: 900; font-size: 16px; display: flex; justify-content: space-between; cursor: pointer; color:#2e1065; }
              
              /* INLINE EXPANDABLE SECTIONS */
              .inline-section { display: none; background: rgba(255,255,255,0.9); padding: 15px; border: 2px dashed #ccc; border-radius: 8px; margin-bottom: 10px; animation: fadeIn 0.3s ease; }
              .w-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
              .w-tab { flex: 1; background: white; text-align: center; padding: 10px; border: 2px solid #ccc; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 14px; }
              .w-tab.active { background: #e5e7eb; border-color:#333; }
              .w-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; box-sizing: border-box; }
              .submit-btn { background: #15803d; color: white; width: 100%; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: 900; border: none; cursor: pointer; margin-bottom:10px; }
              
              .tx-box { padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; background:white; }
              .tx-suc { border-left: 5px solid #15803d; }
              .tx-pen { border-left: 5px solid #f59e0b; }

              /* BOTTOM NAV */
              .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #e5e7eb; z-index: 1000; }
              .nav-icon { width: 50px; height: 50px; background: #f3f4f6; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; border: 2px solid #ddd; transition: 0.3s; }
              .nav-icon.active { background: #f59e0b; color: white; border-color: #d97706; transform: scale(1.1); }
            </style>
            
            <!-- FIREBASE SDKS -->
            <script type="module">
              import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
              import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

              // 🔴 MEE FIREBASE CONFIG IKKADA PETTANDI 🔴
              const firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT.firebaseapp.com",
                projectId: "YOUR_PROJECT",
                storageBucket: "YOUR_PROJECT.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef"
              };

              // Initialize Firebase
              let app, auth;
              try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
              } catch(e) { console.log("Firebase not configured yet."); }

              window.doAuth = function(type) {
                const email = document.getElementById('authEmail').value;
                const pass = document.getElementById('authPass').value;
                if(!email || !pass) { alert("Please enter email & password"); return; }
                
                // If API Key is default, bypass for testing
                if(firebaseConfig.apiKey === "YOUR_API_KEY") {
                  alert("Test Login Success! Please add Real Firebase Keys later.");
                  document.getElementById('auth-screen').style.display = 'none';
                  document.getElementById('main-app').style.display = 'block';
                  return;
                }

                if(type === 'login') {
                  signInWithEmailAndPassword(auth, email, pass)
                    .then((user) => {
                      document.getElementById('auth-screen').style.display = 'none';
                      document.getElementById('main-app').style.display = 'block';
                    }).catch((error) => { alert(error.message); });
                } else {
                  createUserWithEmailAndPassword(auth, email, pass)
                    .then((user) => { alert("Registered Successfully!"); })
                    .catch((error) => { alert(error.message); });
                }
              };
            </script>
          </head>
          <body>

            <!-- AUTH SCREEN -->
            <div id="auth-screen">
              <div class="auth-box">
                <div class="auth-title" id="authTitle">LOGIN</div>
                <input type="email" id="authEmail" class="auth-input" placeholder="Email Address">
                <input type="password" id="authPass" class="auth-input" placeholder="Password">
                <button class="auth-btn" id="authBtn" onclick="doAuth('login')">LOGIN SECURELY</button>
                <div class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">Don't have an account? Register Here</div>
              </div>
            </div>

            <!-- MAIN APP (Hidden until login) -->
            <div id="main-app">
              <div class="top-bar">
                <div class="coin-box">🪙 <span class="bal-txt">12.5</span></div>
              </div>

              <!-- HOME TAB -->
              <div id="tab-home" class="tab-content active">
                <div class="daily-claim-box">
                  <div class="days-row">
                    <div class="day-box">1</div><div class="day-box">2</div><div class="day-box">3</div>
                    <div class="day-box">4</div><div class="day-box">5</div><div class="day-box">6</div><div class="day-box">7</div>
                  </div>
                  <button class="claim-btn" onclick="alert('Claimed +5 Coins!')">CLAIM NOW</button>
                </div>
                <div class="task-card">
                  <div class="task-title">Solve Captcha</div>
                  <div class="start-btn" onclick="alert('Captcha Started!')">▶ START</div>
                </div>
                <div class="task-card">
                  <div class="task-title">Play Quiz</div>
                  <div class="start-btn" onclick="alert('Quiz Started!')">▶ START</div>
                </div>
              </div>

              <!-- WATCH TAB (YOUTUBE VIDEOS) -->
              <div id="tab-watch" class="tab-content">
                <h2 style="text-align:center; color:#2e1065; margin-top:0;">Watch & Earn</h2>
                
                <!-- YouTube Iframe Player -->
                <div class="yt-player-container" id="ytPlayerContainer">
                  <iframe id="ytIframe" width="100%" height="220" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>

                <div class="yt-grid">
                  <div onclick="playVideo('gR49U4k42y8')">
                    <img src="https://img.youtube.com/vi/gR49U4k42y8/mqdefault.jpg" class="yt-thumb">
                    <div class="yt-title">Telugu Latest News</div>
                  </div>
                  <div onclick="playVideo('zT9b6v3X-3Y')">
                    <img src="https://img.youtube.com/vi/zT9b6v3X-3Y/mqdefault.jpg" class="yt-thumb">
                    <div class="yt-title">Comedy Scenes</div>
                  </div>
                  <div onclick="playVideo('E07s5ZYygMg')">
                    <img src="https://img.youtube.com/vi/E07s5ZYygMg/mqdefault.jpg" class="yt-thumb">
                    <div class="yt-title">Tech Updates</div>
                  </div>
                  <div onclick="playVideo('F44gE2tFz8A')">
                    <img src="https://img.youtube.com/vi/F44gE2tFz8A/mqdefault.jpg" class="yt-thumb">
                    <div class="yt-title">Trending Movies</div>
                  </div>
                </div>
              </div>

              <!-- PROFILE TAB & INLINE WITHDRAWAL -->
              <div id="tab-profile" class="tab-content">
                <div class="pro-header">
                  <div class="pro-name">VIKASH RAJU</div>
                </div>
                <div class="id-box">USER ID : 381130</div>
                <div class="pro-wallet">🪙 <span class="bal-txt">12.5</span></div>
                
                <!-- 🔴 INLINE WITHDRAWAL BUTTON 🔴 -->
                <div class="menu-item" onclick="toggleSection('withdrawSec')">
                  💳 WITHDRAWAL <span>▼</span>
                </div>
                
                <!-- INLINE WITHDRAWAL FORM -->
                <div id="withdrawSec" class="inline-section">
                  <div class="w-tabs">
                    <div class="w-tab active" id="tabBank" onclick="selW('bank')">BANK 🏦</div>
                    <div class="w-tab" id="tabUpi" onclick="selW('upi')">UPI ID</div>
                  </div>
                  <div id="w-form-bank">
                    <input type="text" class="w-input" placeholder="BANK NAME">
                    <input type="text" class="w-input" placeholder="ACCOUNT HOLDER">
                    <input type="number" class="w-input" placeholder="ACCOUNT NUMBER">
                  </div>
                  <div id="w-form-upi" style="display:none;">
                    <input type="text" class="w-input" id="upiId" placeholder="ENTER UPI ID">
                  </div>
                  <input type="number" id="wAmount" class="w-input" placeholder="Amount (e.g. 12.50)" style="border-color:#2e1065;">
                  <button class="submit-btn" onclick="submitAppScript()">SUBMIT REQUEST</button>
                </div>

                <!-- 🔴 INLINE TRANSACTIONS BUTTON 🔴 -->
                <div class="menu-item" onclick="toggleSection('txSec')">
                  📜 RECENT TRANSACTIONS <span>▼</span>
                </div>
                
                <div id="txSec" class="inline-section">
                  <div class="tx-box tx-pen"><span>Pending Request</span> <span>🪙 12.5</span></div>
                  <div class="tx-box tx-suc"><span>Success</span> <span>🪙 60</span></div>
                  <div class="tx-box tx-suc"><span>Success</span> <span>🪙 147</span></div>
                </div>

                <div class="menu-item">⚙️ SETTINGS <span>➜</span></div>
                <div class="menu-item">📞 CONTACT US <span>➜</span></div>
              </div>

              <!-- BOTTOM NAV -->
              <div class="bottom-nav">
                <div class="nav-icon active" id="nav-home" onclick="nav('home')">🏠</div>
                <div class="nav-icon" id="nav-watch" onclick="nav('watch')">▶</div>
                <div class="nav-icon" id="nav-profile" onclick="nav('profile')">👤</div>
              </div>
            </div>

            <script>
              // --- LOGIN TOGGLE ---
              let isLogin = true;
              function toggleAuthMode() {
                isLogin = !isLogin;
                document.getElementById('authTitle').innerText = isLogin ? "LOGIN" : "REGISTER";
                document.getElementById('authBtn').innerText = isLogin ? "LOGIN SECURELY" : "CREATE ACCOUNT";
                document.getElementById('authBtn').setAttribute('onclick', isLogin ? "doAuth('login')" : "doAuth('register')");
                document.getElementById('authSwitch').innerText = isLogin ? "Don't have an account? Register Here" : "Already have an account? Login";
              }

              // --- NAVIGATION ---
              function nav(tab) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');
                document.getElementById('nav-' + tab).classList.add('active');
                
                // Pause YT Video if leaving watch tab
                if(tab !== 'watch') {
                  document.getElementById('ytIframe').src = "";
                  document.getElementById('ytPlayerContainer').style.display = 'none';
                }
              }

              // --- YOUTUBE PLAY LOGIC ---
              function playVideo(videoId) {
                const playerContainer = document.getElementById('ytPlayerContainer');
                const iframe = document.getElementById('ytIframe');
                playerContainer.style.display = 'block';
                iframe.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&modestbranding=1&rel=0";
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }

              // --- INLINE TOGGLES (WITHDRAWAL / TRANSACTIONS) ---
              function toggleSection(id) {
                const sec = document.getElementById(id);
                if(sec.style.display === 'block') {
                  sec.style.display = 'none';
                } else {
                  // Hide others before opening one
                  document.getElementById('withdrawSec').style.display = 'none';
                  document.getElementById('txSec').style.display = 'none';
                  sec.style.display = 'block';
                }
              }

              function selW(type) {
                document.getElementById('tabBank').classList.remove('active');
                document.getElementById('tabUpi').classList.remove('active');
                document.getElementById('w-form-bank').style.display = 'none';
                document.getElementById('w-form-upi').style.display = 'none';
                if(type === 'bank') {
                  document.getElementById('tabBank').classList.add('active');
                  document.getElementById('w-form-bank').style.display = 'block';
                } else {
                  document.getElementById('tabUpi').classList.add('active');
                  document.getElementById('w-form-upi').style.display = 'block';
                }
              }

              // --- GOOGLE APP SCRIPT LOGIC (WITHDRAWAL) ---
              function submitAppScript() {
                const amount = document.getElementById('wAmount').value;
                const upi = document.getElementById('upiId').value;
                if(!amount) { alert("Enter amount!"); return; }

                // 🔴 MEE APPS SCRIPT URL IKKADA PETTANDI 🔴
                const APPSCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

                if(APPSCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                   alert("Test Mode: Withdrawal Requested for " + amount + " Coins!\n(Add actual AppScript URL to save to Google Sheets)");
                   document.getElementById('wAmount').value = "";
                   toggleSection('withdrawSec');
                   return;
                }

                fetch(APPSCRIPT_URL, {
                  method: 'POST',
                  mode: 'no-cors',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: "withdraw", userId: "381130", amount: amount, upi: upi })
                }).then(() => {
                  alert("Withdrawal Request Submitted Successfully!");
                  document.getElementById('wAmount').value = "";
                  toggleSection('withdrawSec');
                }).catch(err => alert("Error submitting request"));
              }
            </script>
          </body>
          </html>
          EOF

          # LAYOUT (SPLASH VIDEO OVERLAY)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#ffffff">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <VideoView
                  android:id="@+id/splashVideo"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_gravity="center" />

              <ImageView
                  android:id="@+id/splashLogo"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/app_icon"
                  android:scaleType="centerCrop"
                  android:background="#ffffff" />
          </FrameLayout>
          EOF

          # THEME
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">#e6e9ff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          
          # MANIFEST
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application android:label="Earnzio" android:icon="@drawable/app_icon" android:theme="@style/Theme.App" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MAIN ACTIVITY (Handles Splash -> WebView)
          cat << 'EOF' > app/src/main/java/com/earnzio/app/MainActivity.java
          package com.earnzio.app;
          
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.VideoView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private VideoView splashVideo;
              private ImageView splashLogo;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webView);
                  splashVideo = findViewById(R.id.splashVideo);
                  splashLogo = findViewById(R.id.splashLogo);
                  
                  // 🔥 SPLASH SCREEN 🔥
                  Uri videoUri = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.splash_video);
                  splashVideo.setVideoURI(videoUri);
                  splashVideo.setOnPreparedListener(mp -> {
                      mp.setLooping(false);
                      mp.setOnInfoListener((mp1, what, extra) -> {
                          if (what == MediaPlayer.MEDIA_INFO_VIDEO_RENDERING_START) {
                              splashLogo.setVisibility(View.GONE);
                              return true;
                          }
                          return false;
                      });
                      splashVideo.start();
                  });
                  splashVideo.setOnCompletionListener(mp -> {
                      splashVideo.setVisibility(View.GONE);
                      splashLogo.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                  });
                  
                  // 🔥 WEBVIEW SETUP 🔥
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build Pro APK
        run: gradle :app:assembleDebug

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNZIO-PROFESSIONAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
